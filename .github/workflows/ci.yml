name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 4 * * *" # nightly: full gate (inclui clone-ready real)
  workflow_dispatch: {} # manual: full gate sob demanda (inclui clone-ready)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: gates:check (cobertura de tarefas por workspace)
        run: pnpm gates:check
      - run: pnpm turbo run lint --continue

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck --continue

  unit:
    name: unit
    runs-on: ubuntu-latest
    needs: [typecheck]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aurum_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --continue
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aurum_test
          REDIS_URL: redis://localhost:6379

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --continue

  prisma:
    name: prisma-validate-diff
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: prisma validate (1 entrypoint, 9 schemas)
        run: bash deploy/scripts/prisma-validate.sh
      - name: migrate diff --check (sem drift)
        run: |
          set -e
          if [ -f deploy/scripts/migrate-diff-check.sh ]; then
            bash deploy/scripts/migrate-diff-check.sh
          else
            echo "WARN: deploy/scripts/migrate-diff-check.sh ausente (T3) — checagem adiada, não falha Fase 1."
          fi

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-ephemeral:
    name: e2e-compose-efemero
    runs-on: ubuntu-latest
    needs: [prisma]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: compose efêmero
        run: |
          set -e
          cp .env.example .env
          bash deploy/scripts/pgbouncer-userlist.sh
          docker compose -f deploy/docker-compose.yml up --build -d
          docker compose -f deploy/docker-compose.yml ps
      - name: aguarda /health/ready
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health/ready; then echo; break; fi
            echo "tentativa $i/30..."
            sleep 10
            if [ "$i" = "30" ]; then
              echo "--- ready body ---"
              curl -s http://localhost:3000/health/ready || true
              echo
              echo "--- ps ---"
              docker compose -f deploy/docker-compose.yml ps || true
              echo "--- postgres (init) ---"
              docker compose -f deploy/docker-compose.yml logs --tail=60 postgres || true
              echo "--- pgbouncer ---"
              docker compose -f deploy/docker-compose.yml logs --tail=60 pgbouncer || true
              echo "--- api (tail) ---"
              docker compose -f deploy/docker-compose.yml logs --tail=60 api || true
              exit 1
            fi
          done
      - name: smoke live + ready + metrics
        run: |
          set -e
          curl -fsS http://localhost:3000/health/live
          echo
          curl -fsS http://localhost:3000/health/ready | grep -q '"status":"ok"'
          curl -fsS http://localhost:3000/metrics | grep -q 'http_requests_total'
      - name: logs em falha
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=300
      - name: derruba compose
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  prod-config:
    name: prod-config
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      # `compose config` é só parse client-side: verde sem Docker daemon.
      - name: compose prod config (sem daemon, sem deploy)
        run: |
          set -e
          if [ -f deploy/docker-compose.prod.yml ]; then
            docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml config --quiet
          else
            echo "WARN: deploy/docker-compose.prod.yml ausente (T1) — valida só o base."
            docker compose -f deploy/docker-compose.yml config --quiet
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: prisma validate (1 entrypoint, 9 schemas)
        run: bash deploy/scripts/prisma-validate.sh
      - name: bash -n scripts deploy
        run: |
          set -e
          for s in clone-ready-timer.sh migrate-all.sh seed-all.sh seed-prod.sh verify-dbs.sh migrate-diff-check.sh prisma-validate.sh pgbouncer-userlist.sh pg-backup.sh pg-restore-probe.sh backup-check.sh smoke-prod.sh smoke-t0.sh pre-dns-check.sh gen-prod-env.sh tag-images.sh harden-vps.sh disk-check.sh audit-partition.sh; do
            echo "== bash -n $s =="
            bash -n "deploy/scripts/$s"
          done

  clone-ready:
    name: clone-ready-timer
    runs-on: ubuntu-latest
    needs: [prod-config]
    # Só nightly/manual: exige Docker real e ~10min; nunca em PR/push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: clone→ready <10min (teardown automático, sem --keep)
        run: bash deploy/scripts/clone-ready-timer.sh --local
      - name: logs em falha
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=300
      - name: derruba compose
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  trivy:
    name: trivy-fs
    runs-on: ubuntu-latest
    needs: [e2e-ephemeral, secrets]
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Sem isto, com format sarif a action apaga o filtro de severidade e
          # o gate falha em LOW/MEDIUM. Gate = HIGH,CRITICAL por desenho.
          limit-severities-for-sarif: true
          # A action monta o ignore via TRIVY_IGNOREFILE; sem este input o
          # .trivyignore da raiz não é lido no CWD dela (ver PHASE-9-REPORT).
          trivyignores: .trivyignore
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
