name: CD-HML

# Stub Fase 1 (T5): homologação. Sem negócio.
# Fluxo: build sha-tag → migrate deploy → rolling → smoke /health/ready.
# Habilitar de verdade na Fase 6 (Robustez). Gatilho manual + push em develop.

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api-hml
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  build-push:
    name: build-sha-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: migrate-deploy
    runs-on: ubuntu-latest
    needs: [build-push]
    environment: hml
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Segredos via environment secrets (nunca hardcoded). DB único aurumbit:
      # 9 DATABASE_URL_* (mesma base, ?schema= por domínio) + MIGRATOR_DATABASE_URL (papel DDL).
      - name: migrate deploy (9 DBs, ordem fixa)
        run: |
          set -e
          if [ -f deploy/scripts/migrate-all.sh ]; then
            bash deploy/scripts/migrate-all.sh
          else
            echo "STUB: deploy/scripts/migrate-all.sh ainda não existe (T3). Nada a migrar."
          fi
        env:
          DATABASE_URL_AUTH: ${{ secrets.DATABASE_URL_AUTH_HML }}
          DATABASE_URL_CUSTOMERS: ${{ secrets.DATABASE_URL_CUSTOMERS_HML }}
          DATABASE_URL_PRODUCTS: ${{ secrets.DATABASE_URL_PRODUCTS_HML }}
          DATABASE_URL_ACCESS: ${{ secrets.DATABASE_URL_ACCESS_HML }}
          DATABASE_URL_LICENSING: ${{ secrets.DATABASE_URL_LICENSING_HML }}
          DATABASE_URL_BILLING: ${{ secrets.DATABASE_URL_BILLING_HML }}
          DATABASE_URL_FINANCE: ${{ secrets.DATABASE_URL_FINANCE_HML }}
          DATABASE_URL_AUDIT: ${{ secrets.DATABASE_URL_AUDIT_HML }}
          DATABASE_URL_COMMUNICATIONS: ${{ secrets.DATABASE_URL_COMMUNICATIONS_HML }}
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL_HML }}

  deploy:
    name: rolling-deploy
    runs-on: ubuntu-latest
    needs: [migrate]
    environment: hml
    steps:
      - run: |
          echo "STUB: rolling deploy HML imagem ${{ needs.build-push.outputs.sha_tag }}"
          echo "Fase 6 plugará o alvo real (compose pull/up ou kubectl rollout restart)."
          echo "Comando pretendido:"
          echo "  IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.sha_tag }} docker compose -f deploy/docker-compose.yml up -d --no-deps --pull always api workers"

  smoke:
    name: smoke-health
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: smoke /health/live /health/ready
        run: |
          set -e
          BASE="${SMOKE_BASE_URL:-https://hml.example.invalid}"
          echo "STUB: sem host HML real — valida construção do smoke contra localhost quando disponível."
          if curl -fsS http://localhost:3000/health/live; then
            curl -fsS http://localhost:3000/health/ready | grep -q '"status":"ok"'
            curl -fsS http://localhost:3000/metrics | grep -q 'http_requests_total'
          else
            echo "STUB OK: nenhum alvo local; em HML real troque para: $BASE/health/ready"
          fi
