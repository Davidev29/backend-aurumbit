name: CD-PROD

# Stub Fase 1 (T5): produção. Sem negócio. Exige aprovação manual (environment: prod).
# Fluxo: build sha-tag → migrate deploy → rolling → smoke /health/ready.
# Habilitar de verdade na Fase 6. Nunca auto-deploy de main sem approval.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag da imagem promovida da HML (ex. sha-abc123...) ou vX.Y.Z"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  build-push:
    name: build-sha-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "sha_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "sha_tag=${GITHUB_REF#refs/tags/}-sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          else
            echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: migrate-deploy
    runs-on: ubuntu-latest
    needs: [build-push]
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: migrate deploy (DB único aurumbit, set -e)
        run: |
          set -e
          if [ -f deploy/scripts/migrate-all.sh ]; then
            bash deploy/scripts/migrate-all.sh
          else
            echo "STUB: deploy/scripts/migrate-all.sh ainda não existe (T3). Nada a migrar."
          fi
        env:
          DATABASE_URL_AUTH: ${{ secrets.DATABASE_URL_AUTH_PROD }}
          DATABASE_URL_CUSTOMERS: ${{ secrets.DATABASE_URL_CUSTOMERS_PROD }}
          DATABASE_URL_PRODUCTS: ${{ secrets.DATABASE_URL_PRODUCTS_PROD }}
          DATABASE_URL_ACCESS: ${{ secrets.DATABASE_URL_ACCESS_PROD }}
          DATABASE_URL_LICENSING: ${{ secrets.DATABASE_URL_LICENSING_PROD }}
          DATABASE_URL_BILLING: ${{ secrets.DATABASE_URL_BILLING_PROD }}
          DATABASE_URL_FINANCE: ${{ secrets.DATABASE_URL_FINANCE_PROD }}
          DATABASE_URL_AUDIT: ${{ secrets.DATABASE_URL_AUDIT_PROD }}
          DATABASE_URL_COMMUNICATIONS: ${{ secrets.DATABASE_URL_COMMUNICATIONS_PROD }}
          MIGRATOR_DATABASE_URL: ${{ secrets.MIGRATOR_DATABASE_URL_PROD }}

  deploy:
    name: rolling-deploy
    runs-on: ubuntu-latest
    needs: [migrate]
    environment: prod
    steps:
      - run: |
          echo "STUB: rolling deploy PROD imagem ${{ needs.build-push.outputs.sha_tag }}"
          echo "Exigir janela de deploy + rollback por tag anterior (Fase 6)."
          echo "Comando pretendido (alvo a definir na Fase 6):"
          echo "  IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.sha_tag }} <orquestrador> rollout"

  smoke:
    name: smoke-health-ready
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: smoke /health/live /health/ready /metrics
        run: |
          set -e
          BASE="${SMOKE_BASE_URL:-https://api.example.invalid}"
          echo "STUB: sem host PROD real. Em produção, este job falha o deploy se:"
          echo "  curl -f $BASE/health/live"
          echo "  curl -f $BASE/health/ready | grep '\"status\":\"ok\"'"
          echo "  curl -f $BASE/metrics | grep http_requests_total"
          if curl -fsS http://localhost:3000/health/live 2>/dev/null; then
            curl -fsS http://localhost:3000/health/ready | grep -q '"status":"ok"'
          else
            echo "STUB OK: alvo local ausente, nada a validar em Fase 1."
          fi
