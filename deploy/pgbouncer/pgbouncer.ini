;; deploy/pgbouncer/pgbouncer.ini — PgBouncer do banco consolidado (E2/E3).
;; Imagem: edoburu/pgbouncer:1.22-stable (lê /etc/pgbouncer/pgbouncer.ini;
;; o compose monta este diretório em /etc/pgbouncer:ro).
;; Pool em modo transação: 1 backend por transação; o app NÃO pode usar
;; prepared statements nomeados, LISTEN/NOTIFY nem advisory locks via pool
;; (por isso licensing tem bypass direto — ver risco h1 no compose).
;; Com auth_type scram-sha-256, o auth_file aceita senhas em claro
;; (o PgBouncer executa o SCRAM server-side a partir delas).

[databases]
aurumbit = host=postgres port=5432 dbname=aurumbit

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Espec E2/E3 (não apertar sem medir):
pool_mode = transaction
server_reset_query = DISCARD ALL
max_client_conn = 400
default_pool_size = 20
reserve_pool_size = 5
max_db_connections = 100

;; Prisma envia `extra_float_digits` no startup — sem ignorar, o pool rejeita
;; a conexão ("unsupported startup parameter").
ignore_startup_parameters = extra_float_digits,search_path
