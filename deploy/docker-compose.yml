services:
  postgres:
    image: postgres:16-alpine
    container_name: aurum-postgres
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurum}
      POSTGRES_DB: ${POSTGRES_DB:-aurum}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/01-init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurum} -d ${POSTGRES_DB:-aurum}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - aurum-net

  redis:
    image: redis:7-alpine
    container_name: aurum-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - aurum-net

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: aurum-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8025/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - aurum-net

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: aurum-api:local
    container_name: aurum-api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # URLs internas do container (host `postgres`/`redis`). O .env da raiz
      # usa `localhost` p/ ferramentas do HOST (migrate/seed); aqui vao fixos
      # de container para o env_file nao quebrar a resolucao de nomes.
      DATABASE_URL: postgresql://aurum:aurum@postgres:5432/auth?schema=public
      DATABASE_URL_AUTH: postgresql://aurum:aurum@postgres:5432/auth?schema=public
      DATABASE_URL_CUSTOMERS: postgresql://aurum:aurum@postgres:5432/customers?schema=public
      DATABASE_URL_PRODUCTS: postgresql://aurum:aurum@postgres:5432/products?schema=public
      DATABASE_URL_ACCESS: postgresql://aurum:aurum@postgres:5432/access?schema=public
      DATABASE_URL_LICENSING: postgresql://aurum:aurum@postgres:5432/licensing?schema=public
      DATABASE_URL_BILLING: postgresql://aurum:aurum@postgres:5432/billing?schema=public
      DATABASE_URL_FINANCE: postgresql://aurum:aurum@postgres:5432/finance?schema=public
      DATABASE_URL_AUDIT: postgresql://aurum:aurum@postgres:5432/audit?schema=public
      DATABASE_URL_COMMUNICATIONS: postgresql://aurum:aurum@postgres:5432/communications?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      # Galeria da VPS: fora do FS efêmero do container (volume dedicado).
      # Sem LICENSE_KEY_ENC_KEY, o reveal responde 409 honesto (by design) —
      # configure via .env (nunca commitar; ver .env.example).
      PRODUCT_IMAGES_DIR: /var/lib/aurum/product-images
      LICENSE_KEY_ENC_KEY: ${LICENSE_KEY_ENC_KEY:-}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - product-images:/var/lib/aurum/product-images
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - aurum-net

  workers:
    build:
      context: ..
      dockerfile: apps/workers/Dockerfile
    image: aurum-workers:local
    container_name: aurum-workers
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # URLs internas do container (ver nota no servico api).
      DATABASE_URL: postgresql://aurum:aurum@postgres:5432/auth?schema=public
      DATABASE_URL_AUTH: postgresql://aurum:aurum@postgres:5432/auth?schema=public
      DATABASE_URL_CUSTOMERS: postgresql://aurum:aurum@postgres:5432/customers?schema=public
      DATABASE_URL_PRODUCTS: postgresql://aurum:aurum@postgres:5432/products?schema=public
      DATABASE_URL_ACCESS: postgresql://aurum:aurum@postgres:5432/access?schema=public
      DATABASE_URL_LICENSING: postgresql://aurum:aurum@postgres:5432/licensing?schema=public
      DATABASE_URL_BILLING: postgresql://aurum:aurum@postgres:5432/billing?schema=public
      DATABASE_URL_FINANCE: postgresql://aurum:aurum@postgres:5432/finance?schema=public
      DATABASE_URL_AUDIT: postgresql://aurum:aurum@postgres:5432/audit?schema=public
      DATABASE_URL_COMMUNICATIONS: postgresql://aurum:aurum@postgres:5432/communications?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Fase 1: workers sem endpoint HTTP. Healthcheck mínimo = processo node vivo.
    # T4+ poderá expor /health (ex. porta 3002) e trocar por wget HTTP.
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - aurum-net

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    image: aurum-admin:local
    container_name: aurum-admin
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - aurum-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  product-images:
    driver: local

networks:
  aurum-net:
    driver: bridge
