# deploy/docker-compose.yml — stack DEV local (single-file).
# Projeto canônico: aurum_bit_backend (agrupa tudo no Docker Desktop).
# ATENÇÃO Docker: nome de IMAGEM precisa ser minúsculo por regra do Docker,
# por isso a imagem é `aurum_bit_backend:local`. O CONTAINER aceita
# maiúsculas e aparece exatamente como `Aurum_Bit_Backend` (pedido do dono).
name: aurum_bit_backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: aurum-postgres
    restart: unless-stopped
    # Teto de conexões: pico estimado das roles (~140 com pools cheios + bypass
    # licensing + migrator) + headroom. Default PG (100) estouraria sob carga.
    command: ["postgres", "-c", "max_connections=200"]
    env_file:
      - path: ../.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurum}
      POSTGRES_DB: ${POSTGRES_DB:-aurumbit}
      # Senhas por role p/ o init-dbs.sh (E2/E3). DEV: defaults fracos do script;
      # PROD: .env.prod gerado por gen-prod-env.sh.
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:-dev_migrator_pw}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:-dev_auth_pw}
      APP_CUSTOMERS_PASSWORD: ${APP_CUSTOMERS_PASSWORD:-dev_customers_pw}
      APP_PRODUCTS_PASSWORD: ${APP_PRODUCTS_PASSWORD:-dev_products_pw}
      APP_ACCESS_PASSWORD: ${APP_ACCESS_PASSWORD:-dev_access_pw}
      APP_LICENSING_PASSWORD: ${APP_LICENSING_PASSWORD:-dev_licensing_pw}
      APP_BILLING_PASSWORD: ${APP_BILLING_PASSWORD:-dev_billing_pw}
      APP_COMMUNICATIONS_PASSWORD: ${APP_COMMUNICATIONS_PASSWORD:-dev_comms_pw}
      APP_FINANCE_PASSWORD: ${APP_FINANCE_PASSWORD:-dev_finance_pw}
      APP_FINANCE_REPORTS_PASSWORD: ${APP_FINANCE_REPORTS_PASSWORD:-dev_finrep_pw}
      APP_AUDIT_APPEND_PASSWORD: ${APP_AUDIT_APPEND_PASSWORD:-dev_audit_append_pw}
      APP_AUDIT_READ_PASSWORD: ${APP_AUDIT_READ_PASSWORD:-dev_audit_read_pw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/01-init-dbs.sh:ro
      # Fora de initdb.d de propósito: o SQL exige -v senhas (só o .sh o invoca).
      - ./init-consolidated.sql:/opt/init-consolidated.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurum} -d ${POSTGRES_DB:-aurumbit}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - aurum-net

  redis:
    image: redis:7-alpine
    container_name: aurum-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - aurum-net

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.0-p1
    container_name: aurum-pgbouncer
    restart: unless-stopped
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    volumes:
      # Diretório (não o arquivo): userlist.txt real é gerado fora do repo
      # (ver userlist.txt.example); ausente = pgbouncer recusa auth no boot.
      - ./pgbouncer:/etc/pgbouncer:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aurum-net

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: aurum-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8025/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - aurum-net

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    # NOME PEDIDO PELO DONO:
    # - Imagem  -> `aurum_bit_backend:local` (aba IMAGES do Docker Desktop).
    #   Minúscula por exigência do Docker (repositório não aceita A-Z).
    # - Container -> `Aurum_Bit_Backend` (aba CONTAINERS + `docker ps`).
    #   Exato, com maiúsculas e underscores, como pedido.
    image: aurum_bit_backend:local
    container_name: Aurum_Bit_Backend
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # Banco consolidado `aurumbit` (E2/E3): 1 role por domínio via PgBouncer
      # (host `pgbouncer:6432`). Exceção: LICENSING vai DIRETO no postgres:5432
      # (bypass risco h1 — pool transaction não serve ao hot path de licenças).
      # O .env da raiz usa `localhost` p/ ferramentas do HOST (migrate/seed);
      # aqui vão fixos de container. Senhas: defaults dev fracos; prod via .env.prod.
      DATABASE_URL: postgresql://app_auth:${APP_AUTH_PASSWORD:-dev_auth_pw}@pgbouncer:6432/aurumbit?schema=auth&pgbouncer=true&connection_limit=20
      DATABASE_URL_AUTH: postgresql://app_auth:${APP_AUTH_PASSWORD:-dev_auth_pw}@pgbouncer:6432/aurumbit?schema=auth&pgbouncer=true&connection_limit=20
      DATABASE_URL_CUSTOMERS: postgresql://app_customers:${APP_CUSTOMERS_PASSWORD:-dev_customers_pw}@pgbouncer:6432/aurumbit?schema=customers&pgbouncer=true&connection_limit=15
      DATABASE_URL_PRODUCTS: postgresql://app_products:${APP_PRODUCTS_PASSWORD:-dev_products_pw}@pgbouncer:6432/aurumbit?schema=products&pgbouncer=true&connection_limit=15
      DATABASE_URL_ACCESS: postgresql://app_access:${APP_ACCESS_PASSWORD:-dev_access_pw}@pgbouncer:6432/aurumbit?schema=access&pgbouncer=true&connection_limit=20
      DATABASE_URL_LICENSING: postgresql://app_licensing:${APP_LICENSING_PASSWORD:-dev_licensing_pw}@postgres:5432/aurumbit?schema=licensing&connection_limit=20
      DATABASE_URL_BILLING: postgresql://app_billing:${APP_BILLING_PASSWORD:-dev_billing_pw}@pgbouncer:6432/aurumbit?schema=billing&pgbouncer=true&connection_limit=15
      DATABASE_URL_FINANCE: postgresql://app_finance:${APP_FINANCE_PASSWORD:-dev_finance_pw}@pgbouncer:6432/aurumbit?schema=finance&pgbouncer=true&connection_limit=10
      DATABASE_URL_AUDIT: postgresql://app_audit_append:${APP_AUDIT_APPEND_PASSWORD:-dev_audit_append_pw}@pgbouncer:6432/aurumbit?schema=audit&pgbouncer=true&connection_limit=10
      DATABASE_URL_COMMUNICATIONS: postgresql://app_communications:${APP_COMMUNICATIONS_PASSWORD:-dev_comms_pw}@pgbouncer:6432/aurumbit?schema=communications&pgbouncer=true&connection_limit=15
      DATABASE_URL_FINANCE_REPORTS: postgresql://app_finance_reports:${APP_FINANCE_REPORTS_PASSWORD:-dev_finrep_pw}@pgbouncer:6432/aurumbit?schema=finance&pgbouncer=true&connection_limit=5
      DATABASE_URL_AUDIT_READ: postgresql://app_audit_read:${APP_AUDIT_READ_PASSWORD:-dev_audit_read_pw}@pgbouncer:6432/aurumbit?schema=audit&pgbouncer=true&connection_limit=5
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      # Galeria da VPS: fora do FS efêmero do container (volume dedicado).
      PRODUCT_IMAGES_DIR: /var/lib/aurum/product-images
      # Master key de licenças (E2/E3; E8 migra o uso): só o caminho — o valor
      # vive no arquivo montado abaixo. Sem o arquivo, reveal = 409 honesto.
      # REMOVIDO (E8): LICENSE_KEY_ENC_KEY — não recriar.
      LICENSE_MASTER_KEY_PATH: /run/secrets/license-master-key
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - product-images:/var/lib/aurum/product-images
      # Gerado por gen-prod-env.sh (0600, gitignored). Ausente no dev = o
      # daemon cria um diretório vazio aqui; E8 trata como "sem chave" (409).
      - ./secrets/license-master-key:/run/secrets/license-master-key:ro
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - aurum-net

  workers:
    build:
      context: ..
      dockerfile: apps/workers/Dockerfile
    image: aurum-workers:local
    container_name: aurum-workers
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Banco consolidado (ver nota no servico api): roles via pgbouncer,
      # licensing direto (bypass h1), migrator fora daqui.
      DATABASE_URL: postgresql://app_auth:${APP_AUTH_PASSWORD:-dev_auth_pw}@pgbouncer:6432/aurumbit?schema=auth&pgbouncer=true&connection_limit=20
      DATABASE_URL_AUTH: postgresql://app_auth:${APP_AUTH_PASSWORD:-dev_auth_pw}@pgbouncer:6432/aurumbit?schema=auth&pgbouncer=true&connection_limit=20
      DATABASE_URL_CUSTOMERS: postgresql://app_customers:${APP_CUSTOMERS_PASSWORD:-dev_customers_pw}@pgbouncer:6432/aurumbit?schema=customers&pgbouncer=true&connection_limit=15
      DATABASE_URL_PRODUCTS: postgresql://app_products:${APP_PRODUCTS_PASSWORD:-dev_products_pw}@pgbouncer:6432/aurumbit?schema=products&pgbouncer=true&connection_limit=15
      DATABASE_URL_ACCESS: postgresql://app_access:${APP_ACCESS_PASSWORD:-dev_access_pw}@pgbouncer:6432/aurumbit?schema=access&pgbouncer=true&connection_limit=20
      DATABASE_URL_LICENSING: postgresql://app_licensing:${APP_LICENSING_PASSWORD:-dev_licensing_pw}@postgres:5432/aurumbit?schema=licensing&connection_limit=20
      DATABASE_URL_BILLING: postgresql://app_billing:${APP_BILLING_PASSWORD:-dev_billing_pw}@pgbouncer:6432/aurumbit?schema=billing&pgbouncer=true&connection_limit=15
      DATABASE_URL_FINANCE: postgresql://app_finance:${APP_FINANCE_PASSWORD:-dev_finance_pw}@pgbouncer:6432/aurumbit?schema=finance&pgbouncer=true&connection_limit=10
      DATABASE_URL_AUDIT: postgresql://app_audit_append:${APP_AUDIT_APPEND_PASSWORD:-dev_audit_append_pw}@pgbouncer:6432/aurumbit?schema=audit&pgbouncer=true&connection_limit=10
      DATABASE_URL_COMMUNICATIONS: postgresql://app_communications:${APP_COMMUNICATIONS_PASSWORD:-dev_comms_pw}@pgbouncer:6432/aurumbit?schema=communications&pgbouncer=true&connection_limit=15
      DATABASE_URL_FINANCE_REPORTS: postgresql://app_finance_reports:${APP_FINANCE_REPORTS_PASSWORD:-dev_finrep_pw}@pgbouncer:6432/aurumbit?schema=finance&pgbouncer=true&connection_limit=5
      DATABASE_URL_AUDIT_READ: postgresql://app_audit_read:${APP_AUDIT_READ_PASSWORD:-dev_audit_read_pw}@pgbouncer:6432/aurumbit?schema=audit&pgbouncer=true&connection_limit=5
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      LICENSE_MASTER_KEY_PATH: /run/secrets/license-master-key
    volumes:
      - ./secrets/license-master-key:/run/secrets/license-master-key:ro
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    # Fase 1: workers sem endpoint HTTP. Healthcheck mínimo = processo node vivo.
    # T4+ poderá expor /health (ex. porta 3002) e trocar por wget HTTP.
    healthcheck:
      test: ["CMD", "node", "--version"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - aurum-net

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    image: aurum-admin:local
    container_name: aurum-admin
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "${ADMIN_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - aurum-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  product-images:
    driver: local

networks:
  aurum-net:
    driver: bridge
